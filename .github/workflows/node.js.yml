name: Node.js CI

on:
  push:
    branches: [ "main", "lab5" ]
  pull_request:
    branches: [ "main", "lab5" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Service Redis requis par l'application pour les tests
    services:
      redis:
        image: redis:6-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    # Indique à GitHub d'exécuter npm dans le sous-dossier de l'app
    defaults:
      run:
        working-directory: modules/04.continuous-testing/lab

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: modules/04.continuous-testing/lab/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test
      env:
        REDIS_HOST: 127.0.0.1
        REDIS_PORT: 6379
