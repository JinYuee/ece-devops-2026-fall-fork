name: Node.js CI

on:
  push:
    branches: [ "main", "lab5" ]
  pull_request:
    branches: [ "main", "lab5" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:6-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: modules/04.continuous-testing/lab

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test
      env:
        REDIS_HOST: 127.0.0.1
        REDIS_PORT: 6379

  deploy:
    needs: build
    if: github.ref == 'refs/heads/lab5' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
